<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Informes a Dirección · Wiidem · Acermel SRL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF1F4;          /* fondo frío */
    --card:#FFFFFF;
    --ink:#1B2C38;            /* azul tinta */
    --soft:#5F7382;
    --faint:#93A6B4;
    --hair:#D5DFE6;
    --blue:#447596;           /* AZUL ACERMEL (logo) */
    --blue-deep:#2E5570;
    --blue-bar:#1F4460;
    --sky:#7FB2D0;            /* celeste */
    --sky-tint:#E8F2F8;
    --alert:#C1553F;          /* solo para novedades urgentes */
    --alert-tint:#FBEDE9;
    --ok:#2E7D64;             /* seguimiento resuelto */
    --ok-tint:#E6F2EE;
    --shadow:0 1px 2px rgba(27,44,56,.06),0 8px 22px rgba(27,44,56,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding-bottom:56px}

  /* ---------- Barra de menú ---------- */
  .topbar{background:var(--blue-bar);color:#EAF2F7;border-bottom:3px solid var(--sky);position:sticky;top:0;z-index:10}
  .topbar-inner{max-width:1040px;margin:0 auto;padding:11px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:baseline;gap:12px;min-width:0}
  .brand .mark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:.06em}
  .brand .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--sky);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#A9C6D8;text-align:right;white-space:nowrap}
  .bar-meta b{color:#EAF2F7;font-weight:600}

  main{max-width:1040px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
  .section-label{display:flex;align-items:center;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:26px 0 16px}
  .section-label::after{content:"";flex:1;height:1px;background:var(--hair)}

  /* ---------- Novedades ---------- */
  .novedades{background:var(--card);border:1px solid var(--hair);border-left:3px solid var(--blue);border-radius:12px;padding:18px clamp(16px,3vw,22px);box-shadow:var(--shadow)}
  .nov-item{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--hair)}
  .nov-item:first-of-type{border-top:none;padding-top:2px}
  .nov-tag{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:5px;margin-top:1px;background:var(--sky-tint);color:var(--blue-deep);border:1px solid #CFE3EF;min-width:88px;text-align:center}
  .nov-tag.alerta{background:var(--alert-tint);color:var(--alert);border-color:#EFCFC6}
  .nov-item p{font-size:14px}
  .nov-empty{font-size:13.5px;color:var(--soft);font-style:italic}


  /* ---------- Seguimientos ---------- */
  .seg{background:var(--card);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .seg table{width:100%;border-collapse:collapse}
  .seg th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500;text-align:left;padding:12px 16px 9px;border-bottom:1px solid var(--hair);background:#F7FAFC}
  .seg td{padding:14px 16px;border-bottom:1px solid var(--hair);vertical-align:top;font-size:13.5px}
  .seg tr:last-child td{border-bottom:none}
  .seg .tema{font-weight:600;color:var(--ink);min-width:170px}
  .seg .tema small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:400;color:var(--faint);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
  .seg .acc{color:var(--soft);max-width:52ch}
  .seg .est{white-space:nowrap;width:1%}
  .seg .desde{white-space:nowrap;width:1%;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--soft);text-align:right}
  .seg .desde b{display:block;color:var(--ink);font-weight:600;font-size:12px}
  .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:5px;border:1px solid}
  .badge.decision{background:var(--alert-tint);color:var(--alert);border-color:#EFCFC6}
  .badge.curso{background:var(--sky-tint);color:var(--blue-deep);border-color:#CFE3EF}
  .badge.planta{background:#F3F6F8;color:var(--soft);border-color:var(--hair)}
  .badge.resuelto{background:var(--ok-tint);color:var(--ok);border-color:#C9E2DA}
  .seg tr.cerrado .tema,.seg tr.cerrado .acc{color:var(--faint)}
  .seg-empty{padding:30px;text-align:center;color:var(--soft);font-size:13.5px;font-style:italic}

  /* ---------- Informes ---------- */
  .list{display:flex;flex-direction:column;gap:12px}
  .card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(14px,3vw,30px);background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:18px clamp(16px,3vw,24px);text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
  .card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 2px 4px rgba(27,44,56,.08),0 14px 30px rgba(68,117,150,.18);outline:none}
  .card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

  /* bloque de fechas de la semana */
  .stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;width:84px;padding:11px 6px;border-radius:10px;background:var(--blue);color:#fff;font-family:'IBM Plex Mono',monospace;line-height:1}
  .stamp .rng{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .stamp .mes{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#D3E6F1;margin-top:6px}
  .stamp .anio{font-size:9.5px;color:#AECDDF;margin-top:3px}

  .body h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(15px,2.3vw,18px);line-height:1.25;letter-spacing:-.01em;margin-bottom:5px}
  .body p{font-size:13.5px;color:var(--soft);max-width:62ch}
  .semana{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--blue-deep);margin-top:8px;font-weight:500}
  .go{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--blue)}
  .go svg{transition:transform .16s ease}
  .card:hover .go svg,.card:focus-visible .go svg{transform:translateX(4px)}
  .latest{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--blue-deep);border-radius:20px;padding:2px 9px;margin-bottom:7px}
  .empty{background:var(--card);border:1px dashed var(--hair);border-radius:12px;padding:36px;text-align:center;color:var(--soft);font-size:14px}

  footer{max-width:1040px;margin:36px auto 0;padding:18px clamp(16px,4vw,40px) 0;border-top:1px solid var(--hair);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  @media (max-width:600px){
    .card{grid-template-columns:auto 1fr;grid-template-areas:"stamp body" "go go";row-gap:12px}
    .stamp{grid-area:stamp}.body{grid-area:body}.go{grid-area:go;justify-self:start}
    .brand .sub{display:none}.nov-tag{min-width:auto}
    .seg thead{display:none}
    .seg tr{display:block;border-bottom:1px solid var(--hair);padding:14px 16px}
    .seg tr:last-child{border-bottom:none}
    .seg td{display:block;border:none;padding:0 0 7px}
    .seg .desde{text-align:left;width:auto}
    .seg .est{width:auto;padding-bottom:9px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="mark">ACERMEL</span>
        <span class="sub">Wiidem · Informes a Dirección</span>
      </div>
      <div class="bar-meta"><b id="total">0</b> informes · últ. <b id="ultima">—</b></div>
    </div>
  </header>

  <main>
    <div class="section-label">Novedades de la semana</div>
    <div class="novedades" id="novedades"></div>

    <div class="section-label">Temas en seguimiento</div>
    <div class="seg" id="seguimientos"></div>

    <div class="section-label">Informes semanales · más reciente primero</div>
    <div class="list" id="lista"></div>
  </main>

  <footer>
    <span>Acermel SRL — uso interno de Dirección</span>
    <span id="anio"></span>
  </footer>

<script>
/* =====================================================================
   1) NOVEDADES DE LA SEMANA   (editá / vaciá cuando quieras)
      tipo: texto libre corto — Ausencia · Pendiente · Monitoreo · Nota
      alerta: true -> se resalta (para lo urgente)
      Si no querés mostrar nada:  const NOVEDADES = [
  { tipo:"Pulidora 55", alerta:true,
    texto:"<b>7 de los 12 productos en rojo salieron de este puesto</b>, todos de bajo volumen (6 a 67 piezas): Asadera 80x60 Cepillo (4,9× vs costos), Polea 180 (3,2×), Tapa Sopera N28 Cepillo (2,4×), Saca Fuente Largo (2,2×) y las dos Pata Soporte Chafing (~1,9×). Matías ya relevó dos: el TC de costos no existía o estaba mal cargado. Los otros cinco están sin causa. <b>Decisión a tomar: medir y cargar los TC reales de toda esta familia de productos, en vez de tratarlos uno por uno cada semana.</b>" },

  { tipo:"Prensa 2", alerta:true,
    texto:"<b>9% productiva sobre 39 hs registradas.</b> 34,9 hs se fueron en Cambio Prensa: 6 eventos de ~350 min cada uno. Casi toda la semana fue preparación, no producción. <b>Decisión a tomar: revisar por qué el cambio de matriz está tardando ~6 hs y si se pueden agrupar las órdenes para hacer menos cambios.</b>" },

  { tipo:"TC en Wiidem", alerta:false,
    texto:"Matías cronometró dos productos de balancines (Cuchara Guisera Estampa Mango y Lechera 2 Pers. Marcado Pico) y confirmó que el TC de costos está mal cargado, pero <b>el valor no se corrigió en Wiidem</b>. Mientras no se actualice, esos productos van a seguir apareciendo desviados sin serlo." },

  { tipo:"Calidad dato", alerta:false,
    texto:"3 eventos de tablet sin cerrar (53 hs), otra vez cruzando la noche. Dejan a <b>Plegadora 100</b> (60% del tiempo excluido) y <b>Esmerilado Izq. 64</b> (42%) sin veredicto esta semana. Venían siendo 6 eventos y 252 hs la semana anterior; mejoró, pero sigue abierto." }
];
   ===================================================================== */
const NOVEDADES = [
  { tipo:"Prensa 2", alerta:true,
    texto:"<b>Pala despacho 00 y 01 – Estampado:</b> tardan ~3,2× lo que dice la planilla de costos (TC costos 0,58–0,67 min vs real 1,86–2,12 min, sobre 900 piezas). El tiempo extra es preparación manual de la pieza, no la máquina. <b>Decisión a tomar: subir el tiempo en costos, o cambiar el material de la matriz para dejar de usar papel con gasoil.</b>" },

  { tipo:"Plegadoras", alerta:true,
    texto:"<b>Cuatro productos por encima de costos:</b> Espátula Untar 8″ (3,3×) y 10″ (2,95×), Fondo Colador Cuadrado 16×16 – Plegado Borde (2,35×) y Asa Cacerola Donna – Plegado Punta (1,94×). <b>Decisión a tomar: actualizar los costos, o fabricar una matriz que haga los dos plegados de un golpe y reduzca el tiempo a la mitad.</b>" },

  { tipo:"Calidad dato", alerta:false,
    texto:"6 eventos de tablet quedaron sin cerrar (252 hs), varios de viernes a lunes. Invalidan el dato de Esmerilado y Plegadora 100 esta semana; se excluyeron del cálculo. En seguimiento con planta." },

  { tipo:"Nota", alerta:false,
    texto:"Plegadora 100: 13 hs en “Otra Tarea Designada” sin tipificar, segunda semana consecutiva. Se está revisando qué tarea es para darle su propia categoría." }
];

/* =====================================================================
   1b) TEMAS EN SEGUIMIENTO   (se edita a mano, igual que NOVEDADES)
   ---------------------------------------------------------------------
   Un tema entra acá cuando cruza más de una semana. Se queda hasta que
   se resuelve. Las semanas abiertas se calculan solas desde "desde".

   Campos:
     tema     -> de qué se trata (corto). Podés agregar   puesto:"Prensa 2"
     problema -> qué está pasando y cuánto cuesta
     solucion -> qué hay que hacer o decidir
     estado   -> "decision" | "curso" | "planta" | "resuelto"
                 decision = esperando que Dirección defina
                 curso    = ya se está haciendo algo
                 planta   = a la espera de dato o relevamiento de planta
                 resuelto = cerrado (dejalo una o dos semanas y después borralo)
     desde    -> AAAA-MM-DD, cuándo apareció el tema
   Si no querés mostrar nada:  const SEGUIMIENTOS = [];
   ===================================================================== */
const SEGUIMIENTOS = [
  { tema:"Pala despacho 00 y 01", puesto:"Prensa 2 · Estampado", estado:"decision", desde:"2026-08-18",
    problema:"Tardan ~3,2× el tiempo de la planilla de costos (0,58–0,67 min de costos vs 1,86–2,12 min reales, sobre 900 piezas). El tiempo extra es la preparación manual de la pieza con papel y gasoil, no la máquina.",
    solucion:"Definir: subir el tiempo en costos, o cambiar el material de la matriz para dejar de usar papel con gasoil." },

  { tema:"Cuatro productos de plegado sobre costos", puesto:"Plegadoras", estado:"decision", desde:"2026-08-18",
    problema:"Espátula Untar 8″ (3,3×) y 10″ (2,95×), Fondo Colador Cuadrado 16×16 Plegado Borde (2,35×) y Asa Cacerola Donna Plegado Punta (1,94×).",
    solucion:"Definir: actualizar los costos, o fabricar una matriz que haga los dos plegados de un golpe y reduzca el tiempo a la mitad." },

  { tema:"Eventos de tablet sin cerrar", puesto:"Planta · registro", estado:"curso", desde:"2026-08-10",
    problema:"Eventos que quedan abiertos toda la noche o el fin de semana. Invalidan el tiempo real de los puestos afectados: esta semana dejaron a Plegadora 100 y Esmerilado 64 sin veredicto. Venían 6 eventos / 252 hs; esta semana 3 eventos / 53 hs.",
    solucion:"Sostener la conversación en planta con el detalle por operario hasta llegar a cero. Hay planilla semanal con el detalle." },

  { tema:"“Otra Tarea Designada” sin tipificar", puesto:"Plegadora 100", estado:"planta", desde:"2026-08-18",
    problema:"15,9 hs esta semana en una categoría genérica (3 eventos de ~5 hs). Tercera semana consecutiva y en aumento: venía de 13 hs.",
    solucion:"Averiguar qué tarea es realmente y darle su propia categoría en Wiidem, para que deje de contarse como tiempo sin explicar." },

  { tema:"TC cronometrados que no se cargaron en Wiidem", puesto:"Balancines 44 y 45", estado:"decision", desde:"2026-08-24",
    problema:"Matías cronometró Cuchara Guisera Estampa Mango y Lechera 2 Pers. Marcado Pico y confirmó que el TC de costos está mal, pero el valor no se corrigió en Wiidem.",
    solucion:"Actualizar el TC en Wiidem (y en la planilla de costos) para que dejen de aparecer como desvío." },

  { tema:"Familia Asadera / Chafing sin TC real", puesto:"Pulidora 55", estado:"decision", desde:"2026-08-24",
    problema:"7 de los 12 rojos de la semana salieron de este puesto. Varios productos no tenían tiempo en la planilla de costos y se les asignó un valor estimado que no se parece al real (Asadera 80x60 Cepillo llegó a 4,9×).",
    solucion:"Medir y cargar los TC reales de toda la familia de una vez, en lugar de corregir producto por producto cada semana." }
];

/* =====================================================================
   2) INFORMES  ·  lo ÚNICO que tocás por cada informe nuevo
   ---------------------------------------------------------------------
   Por cada informe nuevo:
     a) Dejá el .html en ESTA MISMA carpeta
     b) Copiá una línea de abajo y cambiale los datos (se ordena solo)
   Campos:
     desde / hasta -> AAAA-MM-DD (lunes y viernes de la semana del dato)
     titulo, resumen
     archivo -> nombre EXACTO del .html
   ===================================================================== */
const INFORMES = [
  { desde:"2026-08-24", hasta:"2026-08-28",
    titulo:"Informe semanal de planta — Producción y desvíos de ciclo",
    resumen:"3.038 piezas en 42 productos: 12 en rojo, 7 en amarillo, 23 en verde.",
    archivo:"informe-2026-08-24.html" },
  { desde:"2026-08-18", hasta:"2026-08-21",
    titulo:"Informe semanal de planta — Producción y desvíos de ciclo",
    resumen:"2.327 piezas en 35 productos: 10 en rojo, 2 en amarillo, 23 en verde.",
    archivo:"informe-2026-08-18.html" },
  { desde:"2026-08-10", hasta:"2026-08-14",
    titulo:"Informe semanal de planta — Producción y desvíos de ciclo",
    resumen:"7.484 piezas en 61 productos: 21 en rojo, 4 en amarillo, 35 en verde. 1 sin dato confiable.",
    archivo:"informe-2026-08-10.html" },
  { desde:"2026-08-03", hasta:"2026-08-07",
    titulo:"Informe semanal de planta — Producción y desvíos de ciclo",
    resumen:"3.831 piezas en 67 productos: 21 en rojo, 17 en amarillo, 29 en verde. Foco en Prensa N° 2 y desvíos sin causa registrada.",
    archivo:"informe-2026-08-03.html" },
];

/* ---------------- render (no hace falta tocar de acá para abajo) ---------------- */
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const ABREV=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const P=iso=>{const[a,m,d]=iso.split("-").map(Number);return{a,m,d};};

function etiquetaSemana(d1,d2){                     // "Semana del 3 al 7 de agosto de 2026"
  const A=P(d1),B=P(d2);
  if(A.m===B.m) return `Semana del ${A.d} al ${B.d} de ${MESES[A.m-1]} de ${B.a}`;
  if(A.a===B.a) return `Semana del ${A.d} de ${MESES[A.m-1]} al ${B.d} de ${MESES[B.m-1]} de ${B.a}`;
  return `Semana del ${A.d} de ${MESES[A.m-1]} de ${A.a} al ${B.d} de ${MESES[B.m-1]} de ${B.a}`;
}
function sello(d1,d2){                              // bloque compacto de la tarjeta
  const A=P(d1),B=P(d2);
  const rng=`${String(A.d).padStart(2,"0")}–${String(B.d).padStart(2,"0")}`;
  const mes=A.m===B.m?ABREV[A.m-1]:`${ABREV[A.m-1]}/${ABREV[B.m-1]}`;
  return {rng,mes,anio:B.a};
}
const corto=iso=>{const{a,m,d}=P(iso);return `${d} ${ABREV[m-1]} ${a}`;};

// Novedades
const nov=document.getElementById("novedades");
nov.innerHTML = NOVEDADES.length
  ? NOVEDADES.map(n=>`<div class="nov-item"><span class="nov-tag${n.alerta?' alerta':''}">${n.tipo}</span><p>${n.texto}</p></div>`).join("")
  : '<p class="nov-empty">Sin novedades cargadas esta semana.</p>';

// Seguimientos
const EST={decision:{c:"decision",t:"Decisión pendiente"},curso:{c:"curso",t:"En curso"},
           planta:{c:"planta",t:"Esperando planta"},resuelto:{c:"resuelto",t:"Resuelto"}};
function semanasDesde(iso){
  const{a,m,d}=P(iso); const ini=new Date(a,m-1,d);
  const sem=Math.floor((Date.now()-ini.getTime())/604800000);
  return sem<1?"esta semana":(sem===1?"hace 1 semana":`hace ${sem} semanas`);
}
const seg=document.getElementById("seguimientos");
const abiertos=[...SEGUIMIENTOS].sort((x,y)=>x.desde.localeCompare(y.desde));
seg.innerHTML = abiertos.length
  ? `<table><thead><tr><th>Problema</th><th>Solución / decisión</th><th>Estado</th><th style="text-align:right">Abierto</th></tr></thead><tbody>`
    + abiertos.map(s=>{
        const e=EST[s.estado]||EST.curso;
        return `<tr class="${s.estado==="resuelto"?"cerrado":""}">
          <td class="tema">${s.tema}${s.puesto?`<small>${s.puesto}</small>`:""}</td>
          <td class="acc"><b>${s.problema}</b><br>${s.solucion}</td>
          <td class="est"><span class="badge ${e.c}">${e.t}</span></td>
          <td class="desde"><b>${semanasDesde(s.desde)}</b>${corto(s.desde)}</td></tr>`;
      }).join("")
    + `</tbody></table>`
  : '<p class="seg-empty">Sin temas en seguimiento.</p>';

// Informes
const orden=[...INFORMES].sort((x,y)=>y.desde.localeCompare(x.desde));
const lista=document.getElementById("lista");
lista.innerHTML = orden.length ? orden.map((it,i)=>{
  const s=sello(it.desde,it.hasta);
  return `<a class="card" href="${it.archivo}">
    <div class="stamp"><span class="rng">${s.rng}</span><span class="mes">${s.mes}</span><span class="anio">${s.anio}</span></div>
    <div class="body">
      ${i===0?'<span class="latest">Última</span>':''}
      <h2>${it.titulo}</h2>
      <p>${it.resumen}</p>
      <div class="semana">${etiquetaSemana(it.desde,it.hasta)}</div>
    </div>
    <span class="go">Abrir informe
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9M9 4l4 4-4 4"/></svg>
    </span></a>`;
}).join("") : '<div class="empty">Todavía no hay informes cargados.</div>';
